<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard - Geetanjali Bookstore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
            background: white;
            padding: 25px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #343a40;
            color: white;
        }

        input {
            padding: 7px;
            width: 70px;
        }

        button {
            padding: 7px 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .delete {
            background: #dc3545;
            padding: 7px 12px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👨‍💼 Admin Dashboard</h1>

    <h2>Book & Inventory Management</h2>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Current Stock</th>
            <th>Available</th>
            <th>Update Stock</th>
            <th>Delete</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="book : ${books}">

            <td th:text="${book.id}"></td>

            <td th:text="${book.title}"></td>

            <td>
                ₹<span th:text="${book.price}"></span>
            </td>

            <td th:text="${book.stock}"></td>

            <td th:text="${book.available ? 'Yes' : 'No'}"></td>

            <td>

                <form th:action="@{/admin/books/update-stock/{id}(id=${book.id})}"
                      method="post">

                    <input type="number"
                           name="stock"
                           min="0"
                           th:value="${book.stock}"
                           required>

                    <button type="submit">
                        Update
                    </button>

                </form>

            </td>

            <td>

                <a class="delete"
                   th:href="@{/admin/books/delete/{id}(id=${book.id})}"
                   onclick="return confirm('Delete this book?');">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <a class="back" th:href="@{/}">
        ← Back to Home
    </a>

</div>

</body>

</html>
