<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Geetanjali Bookstore - Books</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        h1, h2 {
            text-align: center;
        }

        .navigation {
            text-align: center;
            margin: 20px 0;
        }

        .navigation a {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .search-box {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
        }

        input, select {
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #343a40;
            color: white;
        }

        .action {
            display: inline-block;
            padding: 7px 10px;
            margin: 3px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .view {
            background: #007bff;
        }

        .cart {
            background: #28a745;
        }

        .delete {
            background: #dc3545;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Geetanjali Bookstore</h1>

    <h2>Available Books</h2>

    <!-- Navigation -->
    <div class="navigation">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/books}">
            Show All Books
        </a>

        <a th:href="@{/books/add}">
            Add New Book
        </a>

        <a th:href="@{/authors}">
            Authors
        </a>

        <a th:href="@{/categories}">
            Categories
        </a>

        <a th:href="@{/cart}">
            🛒 Cart
        </a>

    </div>

    <!-- Search -->
    <div class="search-box">

        <form th:action="@{/books}" method="get">

            <input type="text"
                   name="search"
                   placeholder="Search by book title"
                   th:value="${search}">

            <button type="submit">
                Search
            </button>

        </form>

        <br>

        <!-- Category Filter -->
        <form th:action="@{/books}" method="get">

            <select name="category">

                <option value="">
                    All Categories
                </option>

                <option th:each="category : ${categories}"
                        th:value="${category.name}"
                        th:text="${category.name}"
                        th:selected="${category.name == selectedCategory}">
                </option>

            </select>

            <button type="submit">
                Filter
            </button>

        </form>

        <br>

        <a th:href="@{/books}">
            Show All Books
        </a>

    </div>

    <!-- No books -->
    <div th:if="${books == null or books.isEmpty()}"
         class="empty">

        <h3>No books available.</h3>

        <p>Please add a book to the bookstore.</p>

        <a th:href="@{/books/add}">
            Add New Book
        </a>

    </div>

    <!-- Books table -->
    <table th:unless="${books == null or books.isEmpty()}">

        <thead>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Price</th>
            <th>Stock</th>
            <th>ISBN</th>
            <th>Author</th>
            <th>Category</th>
            <th>Available</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="book : ${books}">

            <td th:text="${book.id}"></td>

            <td th:text="${book.title}"></td>

            <td th:text="${book.description}"></td>

            <td>
                ₹<span th:text="${book.price}"></span>
            </td>

            <td th:text="${book.stock}"></td>

            <td th:text="${book.isbn}"></td>

            <td th:text="${book.author != null ? book.author.name : 'N/A'}">
            </td>

            <td th:text="${book.category != null ? book.category.name : 'N/A'}">
            </td>

            <td th:text="${book.available ? 'Yes' : 'No'}">
            </td>

            <td>

                <a class="action view"
                   th:href="@{/books/{id}(id=${book.id})}">
                    View
                </a>

                <a class="action cart"
                   th:href="@{/cart/add/{id}(id=${book.id})}">
                    🛒 Add to Cart
                </a>

                <a class="action delete"
                   th:href="@{/books/delete/{id}(id=${book.id})}"
                   onclick="return confirm('Are you sure you want to delete this book?');">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
