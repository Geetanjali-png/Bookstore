<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Shopping Cart - Geetanjali Bookstore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #343a40;
            color: white;
        }

        .btn {
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 5px;
            color: white;
            margin: 3px;
            display: inline-block;
        }

        .plus {
            background: green;
        }

        .minus {
            background: orange;
        }

        .remove {
            background: red;
        }

        .clear {
            background: #dc3545;
        }

        .checkout {
            background: #007bff;
        }

        .empty {
            text-align: center;
            padding: 50px;
            background: white;
        }

        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 Shopping Cart</h1>

    <div th:if="${cartItems.isEmpty()}" class="empty">

        <h2>Your cart is empty</h2>

        <a href="/books" class="btn checkout">
            Continue Shopping
        </a>

    </div>

    <div th:unless="${cartItems.isEmpty()}">

        <table>

            <thead>
            <tr>
                <th>Book</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="item : ${cartItems}">

                <td th:text="${item.title}"></td>

                <td>
                    ₹<span th:text="${item.price}"></span>
                </td>

                <td>

                    <a class="btn minus"
                       th:href="@{/cart/decrease/{id}(id=${item.bookId})}">
                        −
                    </a>

                    <span th:text="${item.quantity}"></span>

                    <a class="btn plus"
                       th:href="@{/cart/increase/{id}(id=${item.bookId})}">
                        +
                    </a>

                </td>

                <td>
                    ₹<span th:text="${item.total}"></span>
                </td>

                <td>

                    <a class="btn remove"
                       th:href="@{/cart/remove/{id}(id=${item.bookId})}">
                        Remove
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="total">
            Cart Total:
            ₹<span th:text="${cartTotal}"></span>
        </div>

        <br>

        <div style="text-align:right">

            <a href="/books" class="btn checkout">
                Continue Shopping
            </a>

            <a href="/cart/clear" class="btn clear">
                Clear Cart
            </a>

            <a href="/checkout" class="btn checkout">
                Proceed to Checkout
            </a>

        </div>

    </div>

</div>

</body>
</html>
