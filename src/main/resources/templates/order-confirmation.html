<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Order Confirmation</title>
</head>

<body>

<h1>🎉 Order Placed Successfully!</h1>

<h2>Thank you for your order.</h2>

<p>
    Order ID:
    <strong th:text="${order.id}"></strong>
</p>

<p>
    Order Date:
    <span th:text="${order.orderDate}"></span>
</p>

<p>
    Status:
    <strong th:text="${order.status}"></strong>
</p>

<h2>Ordered Books</h2>

<table border="1">

    <thead>
    <tr>
        <th>Book</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="item : ${order.items}">

        <td th:text="${item.bookTitle}"></td>

        <td>
            ₹<span th:text="${item.price}"></span>
        </td>

        <td th:text="${item.quantity}"></td>

        <td>
            ₹<span
                th:text="${item.price * item.quantity}">
            </span>
        </td>

    </tr>

    </tbody>

</table>

<h2>
    Total:
    ₹<span th:text="${order.totalAmount}"></span>
</h2>

<br>

<a th:href="@{/orders}">
    View Order History
</a>

<br><br>

<a th:href="@{/books}">
    Continue Shopping
</a>

<br><br>

<a th:href="@{/}">
    Home
</a>

</body>

</html>
