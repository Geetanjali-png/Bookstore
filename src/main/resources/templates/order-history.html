<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Order History</title>
</head>

<body>

<h1>📦 My Orders</h1>

<div th:if="${orders == null or orders.isEmpty()}">

    <h2>No orders found.</h2>

    <a th:href="@{/books}">
        Start Shopping
    </a>

</div>

<table
        border="1"
        th:unless="${orders == null or orders.isEmpty()}">

    <thead>

    <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="order : ${orders}">

        <td th:text="${order.id}"></td>

        <td th:text="${order.orderDate}"></td>

        <td>
            ₹<span th:text="${order.totalAmount}"></span>
        </td>

        <td th:text="${order.status}"></td>

        <td>

            <a th:href="@{/orders/{id}(id=${order.id})}">
                View Order
            </a>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a th:href="@{/books}">
    Continue Shopping
</a>

<br><br>

<a th:href="@{/}">
    Home
</a>

</body>

</html>
